<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serve Ease Business Solutions | Corporate Services Qatar</title>
  
  <!-- FAVICON (Directly uses logo.png) -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B2545',
              dark: '#06172E',
              blue: '#134074',
              accent: '#8DA9C4',
              gold: '#D4AF37',
              green: '#74C043',
              lightGreen: '#E8F5E9'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .glass-nav {
      background: rgba(11, 37, 69, 0.96);
      backdrop-filter: blur(12px);
    }
    .hero-gradient {
      background: linear-gradient(135deg, #06172E 0%, #0B2545 60%, #134074 100%);
    }
    .hover-lift {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -10px rgba(11, 37, 69, 0.2);
    }
    .whatsapp-pulse {
      animation: pulse-ring 2s infinite;
    }
